<title>Dobeles basketbols</title>
<meta name="description" content="{{DBCK_NAME}} un {{JSSC_NAME}} — rezultāti, spēļu kalendārs, tabulas un izspēles shēma.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
{{STYLE}}
</style>
<!--BODY-->
{{NOTICE}}
<header class="topbar">
  <div class="wrap topbar-inner">
    <button class="icon-btn" id="menu-open" type="button" aria-label="Atvērt izvēlni" aria-controls="drawer" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <nav class="cup-switch" aria-label="Izvēlies kausu">
      <a class="cup-btn" href="{{HREF_HOME}}" data-cup="dbck" aria-label="{{DBCK_NAME}}" title="{{DBCK_NAME}}">
        <img src="assets/dbck-mark.webp" alt="" width="46" height="46"><span class="cup-btn-label">Čempionu kauss</span>
      </a>
      <a class="cup-btn" href="{{HREF_JELGAVA}}" data-cup="jssc" aria-label="{{JSSC_NAME}}" title="{{JSSC_NAME}}">
        <img src="assets/jssc-mark.webp" alt="" width="46" height="46"><span class="cup-btn-label">Izaicinājuma kauss</span>
      </a>
    </nav>
    <span aria-hidden="true"></span>
  </div>
</header>

<section class="hero" aria-labelledby="hero-title">
  <div class="wrap hero-inner">
    <img class="hero-logo" id="hero-logo" src="assets/dbck-logo.webp" alt="" width="168" height="168">
    <div class="hero-copy">
      <p class="eyebrow" id="hero-season">Sezona {{SEASON}}</p>
      <h1 class="hero-title" id="hero-title">{{DBCK_NAME}}</h1>
    </div>
    <div class="season" id="season-bar"></div>
  </div>
  <svg class="ridge" viewBox="0 0 1440 60" preserveAspectRatio="none" aria-hidden="true"><path d="{{RIDGE_A}}"/></svg>
</section>

<main class="wrap main" id="main">
  <section class="block" id="block-last" aria-labelledby="last-title"></section>
  <section class="block" id="block-mvp" aria-label="Kārtas MVP" hidden></section>
  <section class="block" id="block-next" aria-labelledby="next-title"></section>
  <section class="block" id="block-stage" aria-labelledby="stage-title"></section>
  <section class="block" id="block-extra" aria-labelledby="extra-title" hidden></section>
</main>

<main class="wrap game-view" id="game-view" hidden></main>
<main class="wrap cal-view" id="calendar-view" hidden></main>
<main class="wrap std-view" id="standings-view" hidden></main>
<main class="wrap sp-view" id="sponsors-view" hidden></main>
<main class="wrap tm-view" id="teams-view" hidden></main>
<main class="wrap ld-view" id="leaders-view" hidden></main>
<main class="wrap sts-view" id="stats-view" hidden></main>
<div class="sheet-scrim" id="sheet-scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></div>

<footer class="sponsors">
  <svg class="ridge" viewBox="0 0 1440 60" preserveAspectRatio="none" aria-hidden="true"><path d="{{RIDGE_B}}"/></svg>
  <div class="wrap">
    <h2>Atbalstītāji</h2>
    <div class="sponsor-row">
{{SPONSORS_HTML}}
    </div>
    <div class="foot">
      {{FOOTER_TEXT}}
{{SOCIALS}}
    </div>
  </div>
</footer>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="Izvēlne" aria-hidden="true" inert>
  <div class="drawer-head">
    <span class="eyebrow">Izvēlne</span>
    <button class="icon-btn" id="menu-close" type="button" aria-label="Aizvērt izvēlni">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <nav class="drawer-sec" aria-label="Lapas">
    <button class="nav-item" type="button" data-nav="home" aria-current="page">Sākums</button>
    <a class="nav-item" href="{{HREF_CAL}}" data-nav="cal">Kalendārs</a>
    <a class="nav-item" href="{{HREF_STD}}" data-nav="std" id="nav-std">Kopvērtējums</a>
    <a class="nav-item" href="{{HREF_TM}}" data-nav="tm" id="nav-tm">Komandas</a>
    <a class="nav-item" href="{{HREF_LD}}" data-nav="ld" id="nav-ld">Līderi</a>
    <a class="nav-item" href="{{HREF_STS}}" data-nav="sts" id="nav-sts">Statistika</a>
    <a class="nav-item" href="{{HREF_SP}}" data-nav="sp" id="nav-sp">Sponsori</a>
  </nav>
  <nav class="drawer-sec" aria-label="Kausi">
    <p class="eyebrow">Kausi</p>
    <a class="nav-item nav-cup" href="{{HREF_HOME}}" data-cup="dbck"><img src="assets/dbck-mark.webp" alt="" width="34" height="34">Dobeles čempionu kauss</a>
    <a class="nav-item nav-cup" href="{{HREF_JELGAVA}}" data-cup="jssc"><img src="assets/jssc-mark.webp" alt="" width="34" height="34">Jelgavas Izaicinājuma kauss</a>
  </nav>
</aside>

<div class="demo" role="group" aria-label="Prototips: sezonas posms">
  <span class="demo-tag">Prototips</span>
  <button type="button" data-demo="pre"><span class="lg">Pirms sezonas</span><span class="sm">Pirms</span></button>
  <button type="button" data-demo="group"><span class="lg">Grupu turnīrs</span><span class="sm">Grupas</span></button>
  <button type="button" data-demo="k"><span class="lg">Kvalifikācijas grupa</span><span class="sm">Kvalif.</span></button>
  <button type="button" data-demo="playoff"><span class="lg">Izslēgšanas spēles</span><span class="sm">Pusfināli</span></button>
  <button type="button" data-demo="done"><span class="lg">Noslēgums</span><span class="sm">Beigas</span></button>
</div>

<script id="season-data" type="application/json">{{DATA}}</script>
<script id="poster-data" type="application/json">{{POSTER_DATA}}</script>
<script id="sponsor-data" type="application/json">{{SPONSOR_DATA}}</script>
<script>
{{ENGINE}}
</script>
<script>
{{POSTER}}
</script>
<script>
{{APP}}
</script>
