name: Build and check

# Pull requests: build the site and run the checks (no deploy).
# Publishing is done by "Atjaunot datus no tabulas" (sync.yml), which also runs
# on every push to main, so the site always gets fresh data from the sheet and
# basket.lv, not the copy saved in the repository.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check the season sheet template and importer agree
        run: |
          pip install openpyxl==3.1.5 pillow==11.0.0 playwright==1.56.0
          python3 tools/season_sheet.py "$RUNNER_TEMP/sheet.xlsx"
          python3 tools/sheet_sync.py --file "$RUNNER_TEMP/sheet.xlsx" --expect-same
      # One page per address, pre-rendered in a headless browser (the runner's Chrome).
      - name: Build site
        env:
          PRERENDER_CHANNEL: chrome
        run: python3 tools/build.py
      - name: Run checks
        run: node tools/check.js
