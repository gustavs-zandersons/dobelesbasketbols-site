name: Atjaunot datus no tabulas

# Reads the season sheet (Google Sheets) and basket.lv and updates the site:
# settings, teams, halls, sponsors and logos; the calendar, MVPs and decisions;
# games, results, box scores and registered players from basket.lv (saved in
# src/basket). tools/real-season.js combines them into the site's season
# (src/season.json). The demo season (src/sample-data.json) is kept for previews.
#
# Who starts it:
# - the season sheet's script (apps-script/site.gs), on its own: Sundays every
#   15 minutes 09:00–18:00, other days once at 12:00 (Riga time), and from the
#   sheet's menu "Mājaslapa -> Atjaunot mājaslapu tagad";
# - anyone from the Actions tab: "Atjaunot datus no tabulas" -> Run workflow;
# - GitHub's own timer below, once a day as a backup.
# If the sheet has errors, nothing changes on the site; the run fails and its
# summary lists what to fix (tab, row, problem). GitHub emails about failed runs.
#
# The sheet's link is the repository secret SHEET_URL
# (Settings -> Secrets and variables -> Actions).
on:
  workflow_dispatch:
  # Backup only. GitHub's timer is unreliable: on 1 and 8 Nov 2026 it started
  # 14 and 13 of the 37 Sunday runs and skipped the rest without a word. So the
  # regular runs are started from the season sheet (apps-script/site.gs); a run
  # started that way begins at once. This one catches the day's changes if the
  # sheet's timer ever stops. GitHub's clock is UTC: 20:47 Riga winter time, 21:47 summer time
  # (an odd minute: the start of each hour is GitHub's busiest time).
  schedule:
    - cron: '47 18 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: sheet-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # The branch it was started on (normally main; a test branch for trying
      # changes against the real sheet without publishing).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python packages
        run: pip install openpyxl==3.1.5 pillow==11.0.0 playwright==1.56.0
      - name: Read the sheet
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
        run: python3 tools/sheet_sync.py --url "$SHEET_URL"
      # Games, results and box scores from basket.lv (links in the sheet's
      # Iestatījumi). Skipped for a cup without a link; if basket.lv can't be
      # reached the saved data stays and the update carries on.
      - name: Read basket.lv
        run: python3 tools/basket_sync.py
      - name: Demo games for the sheet's teams (previews)
        run: node tools/gen-season.js > src/sample-data.json
      # The site's season: the sheet's calendar, MVPs and decisions with basket.lv's
      # games, results, box scores and players. Report in the job summary.
      - name: The season from the sheet and basket.lv
        run: node tools/real-season.js > src/season.json
      - name: Build and check the site
        env:
          PRERENDER_CHANNEL: chrome
        run: |
          python3 tools/build.py
          node tools/check.js
      - name: Save the new data
        id: save
        run: |
          if [ -z "$(git status --porcelain -- src assets)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing changed in the sheet since the last run."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src assets
          git commit -m "Dati no tabulas ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          git push origin HEAD:${{ github.ref_name }}
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Pushes made by this workflow don't start other workflows, so the
      # deploy is started explicitly.
      - name: Publish the site
        if: steps.save.outputs.changed == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
