name: Atjaunot datus no tabulas

# Reads the season sheet (Google Sheets) and basket.lv, builds the site and
# publishes it to GitHub Pages, all in one run, and only when something changed:
# settings, teams, halls, sponsors and logos; the calendar, MVPs and decisions;
# games, results, box scores and registered players from basket.lv.
# tools/real-season.js combines them into the site's season (src/season.json).
#
# Nothing is committed back to the repository. Every run reads the sheet and
# basket.lv afresh; basket.lv's box scores are kept between runs in GitHub's
# cache (if the cache is gone, they are read again). tools/site_version.py
# compares the inputs with the live /version.json and publishes only on a change.
#
# Who starts it:
# - the season sheet's script (apps-script/site.gs), on its own: Sundays every
#   15 minutes 09:00–18:00, other days once at 12:00 (Riga time), and from the
#   sheet's menu "Mājaslapa -> Atjaunot mājaslapu tagad";
# - anyone from the Actions tab: "Atjaunot datus no tabulas" -> Run workflow
#   (tick "force" to publish even without changes);
# - a push to main (code changes are published with fresh data);
# - GitHub's own timer below, once a day as a backup.
# Started on another branch, it builds and checks against the real sheet but
# doesn't publish.
# If the sheet has errors, nothing changes on the site; the run fails and its
# summary lists what to fix (tab, row, problem). GitHub emails about failed runs.
#
# The sheet's link is the repository secret SHEET_URL
# (Settings -> Secrets and variables -> Actions).
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Publicēt arī tad, ja nekas nav mainījies'
        type: boolean
        default: false
  push:
    branches: [main]
  # Backup only. GitHub's timer is unreliable: on 1 and 8 Nov 2026 it started
  # 14 and 13 of the 37 Sunday runs and skipped the rest without a word. So the
  # regular runs are started from the season sheet (apps-script/site.gs); a run
  # started that way begins at once. This one catches the day's changes if the
  # sheet's timer ever stops. GitHub's clock is UTC: 20:47 Riga winter time, 21:47 summer time
  # (an odd minute: the start of each hour is GitHub's busiest time).
  schedule:
    - cron: '47 18 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sheet-sync
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python packages
        run: pip install openpyxl==3.1.5 pillow==11.0.0 playwright==1.56.0
      - name: Box scores saved by earlier runs
        uses: actions/cache/restore@v4
        with:
          path: src/basket
          key: basket-${{ github.run_id }}
          restore-keys: basket-
      - name: Read the sheet
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
        run: python3 tools/sheet_sync.py --url "$SHEET_URL"
      # Games, results and box scores from basket.lv (links in the sheet's
      # Iestatījumi). Skipped for a cup without a link; if basket.lv can't be
      # reached the saved data stays and the update carries on.
      - name: Read basket.lv
        run: python3 tools/basket_sync.py
      - name: Keep the box scores for the next run
        if: github.ref_name == 'main'
        uses: actions/cache/save@v4
        with:
          path: src/basket
          key: basket-${{ hashFiles('src/basket/**') }}
        continue-on-error: true
      - name: Demo games for the sheet's teams (previews)
        run: node tools/gen-season.js > src/sample-data.json
      # The site's season: the sheet's calendar, MVPs and decisions with basket.lv's
      # games, results, box scores and players. Report in the job summary.
      - name: The season from the sheet and basket.lv
        run: node tools/real-season.js > src/season.json
      # One page per address, pre-rendered in a headless browser (the runner's Chrome).
      - name: Build and check the site
        env:
          PRERENDER_CHANNEL: chrome
        run: |
          python3 tools/build.py
          node tools/check.js
      - name: Anything new to publish?
        id: version
        run: python3 tools/site_version.py ${{ inputs.force && '--force' || '' }}
      - name: Upload the site
        if: steps.version.outputs.publish == 'true' && github.ref_name == 'main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: needs.update.outputs.publish == 'true' && github.ref_name == 'main'
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
